plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def environmentStoreFile = System.getenv('LIQUIDGLASS_RELEASE_STORE_FILE')
def environmentStorePassword = System.getenv('LIQUIDGLASS_RELEASE_STORE_PASSWORD')
def environmentKeyAlias = System.getenv('LIQUIDGLASS_RELEASE_KEY_ALIAS')
def environmentKeyPassword = System.getenv('LIQUIDGLASS_RELEASE_KEY_PASSWORD')
def hasEnvironmentSigning = environmentStoreFile && environmentStorePassword &&
        environmentKeyAlias && environmentKeyPassword
def hasPropertiesSigning = keystorePropertiesFile.exists()
def hasReleaseSigning = hasEnvironmentSigning || hasPropertiesSigning
if (hasPropertiesSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'rongyi.lingbai'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId 'rongyi.lingbai'
        minSdk 35
        targetSdk 37

        ndk {
            abiFilters 'arm64-v8a'
        }
        versionCode 2722
        versionName "27.22"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(hasEnvironmentSigning
                        ? environmentStoreFile : keystoreProperties['storeFile'])
                storePassword hasEnvironmentSigning
                        ? environmentStorePassword : keystoreProperties['storePassword']
                keyAlias hasEnvironmentSigning
                        ? environmentKeyAlias : keystoreProperties['keyAlias']
                keyPassword hasEnvironmentSigning
                        ? environmentKeyPassword : keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : null
            debuggable false
            // Resource shrinking requires R8. Runtime entry points and JNI bridges are retained
            // explicitly in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    packagingOptions {
        resources {
            merges += 'META-INF/xposed/*'
        }
        jniLibs {
            // LSPosed loads the module through its APK class loader inside each target process.
            // Keep native entries uncompressed so that loader can resolve DexKit and the JNI core.
            useLegacyPackaging false
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

kotlin {
    compilerOptions {
        freeCompilerArgs.add('-opt-in=androidx.compose.material3.ExperimentalMaterial3Api')
        freeCompilerArgs.add('-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi')
    }
}

dependencies {
    implementation project(':ampp-core')
    // API and service are deliberately pinned to the same modern Xposed generation.
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.github.libxposed:api:102.0.0'

    // LiquidGlass 26.80 baseline. These versions drive every existing injected glass bar and
    // must remain stable when the optional WeChat panel is added.
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui:1.11.2'
    implementation 'androidx.compose.ui:ui-graphics:1.11.2'
    implementation 'androidx.compose.foundation:foundation:1.11.2'
    implementation 'androidx.compose.animation:animation-core:1.11.2'
    implementation 'androidx.compose.animation:animation:1.11.2'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha26'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.savedstate:savedstate:1.4.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'io.coil-kt.coil3:coil:3.5.0'
    implementation 'io.coil-kt.coil3:coil-compose:3.5.0'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.5.0'
    implementation 'com.composables:icons-material-symbols-outlined-cmp:2.2.1'
    implementation 'com.composables:icons-material-symbols-outlined-filled-cmp:2.2.1'
    implementation 'org.luckypray:dexkit:2.2.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    // Same application-UI renderer and icon versions as the supplied HyperChanger source.
    implementation 'io.github.kyant0:backdrop:2.0.0'
    implementation 'io.github.kyant0:shapes:1.2.0'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.3'
}

// Unpacked archives and clock skew can make Ninja regenerate its manifest indefinitely.
def nativeInputTree = project.fileTree(project.file('src/main/cpp')).matching {
    include '**/CMakeLists.txt', '**/*.cmake', '**/*.c', '**/*.h'
}
def repairNativeInputTimes = tasks.register('repairNativeInputTimes') {
    doLast {
        long now = System.currentTimeMillis()
        nativeInputTree.files.each { nativeInput ->
            def nativePath = nativeInput.toPath()
            if (java.nio.file.Files.getLastModifiedTime(nativePath).toMillis() > now) {
                java.nio.file.Files.setLastModifiedTime(nativePath, java.nio.file.attribute.FileTime.fromMillis(now))
                if (java.nio.file.Files.getLastModifiedTime(nativePath).toMillis() > now) {
                    throw new GradleException('Cannot normalize native input timestamp: ' + nativeInput.name)
                }
                logger.lifecycle('Normalized future native input timestamp: ' + nativeInput.name)
            }
        }
    }
}
tasks.configureEach { nativeTask ->
    if (nativeTask.name.startsWith('configureCMake') || nativeTask.name.startsWith('buildCMake')) {
        nativeTask.dependsOn(repairNativeInputTimes)
    }
}
